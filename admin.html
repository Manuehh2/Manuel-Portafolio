<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-black shadow sticky-top" style="font-family: Oswald;">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Volver al Inicio</a>
        </div>
    </nav>

    <div class="container py-5">
        <h1 class="text-center mb-4">Panel de Control ADMIN</h1>

        <div class="row justify-content-center" id="loginSection">
            <div class="col-md-5 border rounded p-4" style="background-color: rgba(0,0,0,0.2);">
                <h3 class="text-center">Iniciar Sesión</h3>
                <form id="loginForm">
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" id="loginEmail" class="form-control bg-dark text-white" required>
                    </div>
                    <div class="mb-3">
                        <label>Contraseña</label>
                        <input type="password" id="loginPassword" class="form-control bg-dark text-white" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <div id="loginMsg" class="mt-3 text-center"></div>
            </div>
        </div>

        <div id="adminPanels" style="display: none;">
            
            <div class="row justify-content-center mt-4">
                <div class="col-md-5 border rounded p-4 me-md-3 mb-3" style="background-color: rgba(0,0,0,0.2);">
                    <h3 class="text-center" style="color: #00ffff;">Agregar Video</h3>
                    <form id="videoForm">
                        <div class="mb-3">
                            <label>Título</label>
                            <input type="text" id="vidTitulo" class="form-control bg-dark text-white" required>
                        </div>
                        <div class="mb-3">
                            <label>URL</label>
                            <input type="url" id="vidUrl" class="form-control bg-dark text-white" required>
                        </div>
                        <div class="mb-3">
                            <label>Categoría</label>
                            <input type="text" id="vidCategoria" class="form-control bg-dark text-white" placeholder="Ej. Edits">
                        </div>
                        <button type="submit" class="btn btn-info w-100">Guardar</button>
                    </form>
                    <div id="videoMsg" class="mt-3 text-center"></div>
                </div>

                <div class="col-md-5 border rounded p-4 mb-3" id="editPanel" style="background-color: rgba(0,0,0,0.2); display: none; border-color: #ffaa00 !important;">
                    <h3 class="text-center" style="color: #ffaa00;">Editar Video</h3>
                    <form id="editForm">
                        <input type="hidden" id="editVidId"> <div class="mb-3">
                            <label>Título</label>
                            <input type="text" id="editTitulo" class="form-control bg-dark text-white" required>
                        </div>
                        <div class="mb-3">
                            <label>URL</label>
                            <input type="url" id="editUrl" class="form-control bg-dark text-white" required>
                        </div>
                        <div class="mb-3">
                            <label>Categoría</label>
                            <input type="text" id="editCategoria" class="form-control bg-dark text-white">
                        </div>
                        <button type="submit" class="btn btn-warning w-100">Actualizar Video</button>
                        <button type="button" class="btn btn-secondary w-100 mt-2" onclick="cancelarEdicion()">Cancelar</button>
                    </form>
                    <div id="editMsg" class="mt-3 text-center"></div>
                </div>
            </div>

            <div class="row justify-content-center mt-3">
                <div class="col-md-10 border rounded p-4" style="background-color: rgba(0,0,0,0.2);">
                    <h3 class="text-center mb-4">Gestionar Videos Existentes</h3>
                    <div id="listaVideos"></div> 
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = 'https://manuelportafolio-backend.onrender.com/api';
        let userToken = ''; 

        // --- LOGIN ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const msg = document.getElementById('loginMsg');

            try {
                const res = await fetch(`${API_URL}/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    msg.style.color = "#00ffff";
                    msg.innerHTML = `¡Bienvenido ${data.nombre}!`;
                    userToken = data.token; 
                    
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('adminPanels').style.display = 'block';
                    
                    cargarVideos();
                } else {
                    msg.style.color = "red";
                    msg.innerHTML = data.message || "Credenciales incorrectas";
                }
            } catch (error) {
                msg.innerHTML = "Error de conexión";
            }
        });

        // --- LEER VIDEOS (READ) ---
        async function cargarVideos() {
            try {
                const res = await fetch(`${API_URL}/videos`);
                const videos = await res.json();
                const contenedor = document.getElementById('listaVideos');
                
                contenedor.innerHTML = ''; 
                
                if(videos.length === 0){
                    contenedor.innerHTML = '<p class="text-center text-secondary">No hay videos en la base de datos.</p>';
                    return;
                }

                videos.forEach(video => {
                    // Protegemos las comillas simples/dobles al pasar datos a la función
                    const tituloSeguro = video.titulo.replace(/'/g, "\\'");
                    const urlSegura = video.url.replace(/'/g, "\\'");
                    const catSegura = video.categoria ? video.categoria.replace(/'/g, "\\'") : '';

                    contenedor.innerHTML += `
                        <div class="d-flex justify-content-between align-items-center border-bottom border-secondary py-3">
                            <div>
                                <h5 class="mb-1">${video.titulo}</h5>
                                <small class="text-secondary">Categoría: ${video.categoria} | ID: ${video._id}</small>
                            </div>
                            <div>
                                <button onclick="prepararEdicion('${video._id}', '${tituloSeguro}', '${urlSegura}', '${catSegura}')" class="btn btn-sm btn-outline-warning me-2">Editar</button>
                                <button onclick="eliminarVideo('${video._id}')" class="btn btn-sm btn-outline-danger">Borrar</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.log("Error al cargar la lista de videos");
            }
        }

        // --- CREAR VIDEO (CREATE) ---
        document.getElementById('videoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('vidTitulo').value;
            const url = document.getElementById('vidUrl').value;
            const categoria = document.getElementById('vidCategoria').value;
            const msg = document.getElementById('videoMsg');

            try {
                const res = await fetch(`${API_URL}/videos`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${userToken}` 
                    },
                    body: JSON.stringify({ titulo, url, categoria })
                });
                const data = await res.json();

                if (res.ok) {
                    msg.style.color = "#00ffff";
                    msg.innerHTML = "¡Video creado exitosamente!";
                    document.getElementById('videoForm').reset();
                    cargarVideos(); 
                } else {
                    msg.style.color = "red";
                    msg.innerHTML = data.message || "Error al crear el video";
                }
            } catch (error) {
                msg.innerHTML = "Error de conexión";
            }
        });

        // --- PREPARAR EDICIÓN ---
        function prepararEdicion(id, titulo, url, categoria) {
            document.getElementById('editPanel').style.display = 'block';
            document.getElementById('editVidId').value = id;
            document.getElementById('editTitulo').value = titulo;
            document.getElementById('editUrl').value = url;
            document.getElementById('editCategoria').value = categoria;
            document.getElementById('editMsg').innerHTML = '';
            // Hacer scroll hacia arriba para ver el formulario
            window.scrollTo(0, 0); 
        }

        function cancelarEdicion() {
            document.getElementById('editPanel').style.display = 'none';
            document.getElementById('editForm').reset();
        }

        // --- ACTUALIZAR VIDEO (UPDATE) ---
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editVidId').value;
            const titulo = document.getElementById('editTitulo').value;
            const url = document.getElementById('editUrl').value;
            const categoria = document.getElementById('editCategoria').value;
            const msg = document.getElementById('editMsg');

            try {
                const res = await fetch(`${API_URL}/videos/${id}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${userToken}` 
                    },
                    body: JSON.stringify({ titulo, url, categoria })
                });

                if (res.ok) {
                    msg.style.color = "#ffaa00";
                    msg.innerHTML = "¡Video actualizado correctamente!";
                    setTimeout(() => {
                        cancelarEdicion();
                    }, 1500); // Se cierra el panel después de 1.5 seg
                    cargarVideos(); // Recargar la lista
                } else {
                    const data = await res.json();
                    msg.style.color = "red";
                    msg.innerHTML = data.message || "Error al actualizar";
                }
            } catch (error) {
                msg.innerHTML = "Error de conexión";
            }
        });

        // --- ELIMINAR VIDEO (DELETE) ---
        async function eliminarVideo(id) {
            if(!confirm("¿Estás seguro de que quieres borrar este video?")) return;

            try {
                const res = await fetch(`${API_URL}/videos/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${userToken}` 
                    }
                });
                
                if(res.ok) {
                    alert("Video eliminado correctamente");
                    cargarVideos(); 
                } else {
                    const data = await res.json();
                    alert(data.message || "Error al eliminar");
                }
            } catch (error) {
                alert("Error de conexión al intentar eliminar");
            }
        }
    </script>
</body>
</html>
