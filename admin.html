<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-black shadow sticky-top" style="font-family: Oswald;">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Volver al Inicio</a>
        </div>
    </nav>

    <div class="container py-5">
        <h1 class="text-center mb-4">Panel de Control</h1>

        <div class="row justify-content-center" id="loginSection">
            <div class="col-md-5 border rounded p-4" style="background-color: rgba(0,0,0,0.2);">
                <h3 class="text-center">Iniciar Sesión</h3>
                <form id="loginForm">
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" id="loginEmail" class="form-control bg-dark text-white" required>
                    </div>
                    <div class="mb-3">
                        <label>Contraseña</label>
                        <input type="password" id="loginPassword" class="form-control bg-dark text-white" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <div id="loginMsg" class="mt-3 text-center"></div>
            </div>
        </div>

        <div class="row justify-content-center mt-5" id="adminSection" style="display: none;">
            <div class="col-md-6 border rounded p-4" style="background-color: rgba(0,0,0,0.2);">
                <h3 class="text-center" style="color: #00ffff;">Agregar Nuevo Video</h3>
                <form id="videoForm">
                    <div class="mb-3">
                        <label>Título del Video</label>
                        <input type="text" id="vidTitulo" class="form-control bg-dark text-white" required>
                    </div>
                    <div class="mb-3">
                        <label>URL (Ej. enlace de YouTube)</label>
                        <input type="url" id="vidUrl" class="form-control bg-dark text-white" required>
                    </div>
                    <div class="mb-3">
                        <label>Categoría</label>
                        <input type="text" id="vidCategoria" class="form-control bg-dark text-white" placeholder="Ej. Edits, Vlogs">
                    </div>
                    <button type="submit" class="btn btn-info w-100">Guardar Video en Base de Datos</button>
                </form>
                <div id="videoMsg" class="mt-3 text-center"></div>
            </div>
        </div>
    </div>

    <script>
        // Asegúrate de poner tu URL de Render aquí
        const API_URL = 'https://manuelportafolio-backend.onrender.com/api';
        let userToken = ''; // Aquí guardaremos el token temporalmente

        // --- LÓGICA DE LOGIN ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const msg = document.getElementById('loginMsg');

            try {
                const res = await fetch(`${API_URL}/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    msg.style.color = "#00ffff";
                    msg.innerHTML = `¡Bienvenido ${data.nombre}!`;
                    userToken = data.token; // Guardamos el token
                    
                    // Ocultar login y mostrar el panel de videos
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('adminSection').style.display = 'block';
                } else {
                    msg.style.color = "red";
                    msg.innerHTML = data.message || "Credenciales incorrectas";
                }
            } catch (error) {
                msg.innerHTML = "Error de conexión";
            }
        });

        // --- LÓGICA PARA CREAR VIDEO ---
        document.getElementById('videoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('vidTitulo').value;
            const url = document.getElementById('vidUrl').value;
            const categoria = document.getElementById('vidCategoria').value;
            const msg = document.getElementById('videoMsg');

            try {
                const res = await fetch(`${API_URL}/videos`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${userToken}` // ¡AQUÍ ENVIAMOS EL TOKEN!
                    },
                    body: JSON.stringify({ titulo, url, categoria })
                });
                const data = await res.json();

                if (res.ok) {
                    msg.style.color = "#00ffff";
                    msg.innerHTML = "¡Video creado exitosamente en la base de datos!";
                    document.getElementById('videoForm').reset();
                } else {
                    msg.style.color = "red";
                    msg.innerHTML = data.message || "Error al crear el video";
                }
            } catch (error) {
                msg.innerHTML = "Error de conexión";
            }
        });
    </script>
</body>
</html>
